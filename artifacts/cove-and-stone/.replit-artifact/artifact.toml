kind = "web"
previewPath = "/"
title = "Cove & Stone"
description = "A premium responsive website for Cove & Stone, a Jacksonville and Ponte Vedra architectural outdoor-living design-build brand specializing in custom pools, spas, complete backyard environments, renovations, and commercial outdoor projects."
version = "1.0.0"
id = "artifacts/cove-and-stone"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23978

[services.development]
run = "pnpm --filter @workspace/cove-and-stone run dev"

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/cove-and-stone", "run", "build" ]

[services.production.run]
args = [ "pnpm", "--filter", "@workspace/cove-and-stone", "run", "serve" ]

[services.production.run.env]
NODE_ENV = "production"

[services.env]
PORT = "23978"
BASE_PATH = "/"
