openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: design-concepts
    description: Internal pool concept handoff operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /design-concepts/email:
    post:
      operationId: emailDesignConcept
      tags: [design-concepts]
      summary: Email a completed pool concept internally
      description: Sends the completed concept SVG and configuration summary to the Cove & Stone team.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesignConceptEmailRequest"
      responses:
        "202":
          description: Design concept queued for internal delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesignConceptEmailResponse"
        "400":
          description: Invalid design concept
        "502":
          description: Internal email provider failure
  /design-concepts/render:
    post:
      operationId: generatePoolConceptRender
      tags: [design-concepts]
      summary: Generate an AI pool concept from a backyard photo
      description: Creates a photorealistic illustrative after-image from the customer's uploaded backyard photo and selected pool details.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PoolConceptRenderRequest"
      responses:
        "200":
          description: AI-generated pool concept image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoolConceptRenderResponse"
        "400":
          description: Invalid image or pool concept
        "429":
          description: Image generation rate limit reached
        "502":
          description: AI image generation failed
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    DesignConceptEmailRequest:
      type: object
      properties:
        customerName:
          type: string
          minLength: 2
          maxLength: 120
        customerAddress:
          type: string
          minLength: 5
          maxLength: 300
        customerPhone:
          type: string
          minLength: 7
          maxLength: 30
          pattern: '^[+()0-9 .-]+$'
        width:
          type: integer
          minimum: 8
          maximum: 60
        length:
          type: integer
          minimum: 12
          maximum: 100
        shape:
          type: string
          enum: [rectangular, freeform, kidney, l-shape]
        poolFinish:
          type: string
          enum: [white-plaster, arctic-quartz, sandbar-quartz, sea-glass-quartz, lagoon-pebble, ocean-blue-pebble, silver-pebble, greenstone, midnight-pebble]
        waterlineTile:
          type: string
          enum: [pale-limestone, shellstone, mist-porcelain, warm-travertine, sea-glass, lagoon-glass, ocean-blue-glass, deep-navy-glass, charcoal-mosaic]
        deckTile:
          type: string
          enum: [shell-limestone, ivory-porcelain, silver-porcelain, sand-travertine, warm-limestone, coastal-shellstone, charcoal-porcelain]
        edgeTreatment:
          type: string
          enum: [flush-continuous]
        features:
          type: array
          items:
            type: string
            enum: [spa, spa-waterfall, infinity-edge, pool-lights, sun-shelf, sheer-descent, bubblers, sunken-fire-pit, outdoor-kitchen, fire-bowls, pergola, outdoor-shower]
          uniqueItems: true
        svg:
          type: string
          minLength: 1
          maxLength: 120000
        originalPhotoDataUrl:
          type: string
          maxLength: 2900000
          pattern: '^data:image/jpeg;base64,[A-Za-z0-9+/]+={0,2}$'
        aiRenderDataUrl:
          type: string
          maxLength: 6000000
          pattern: '^data:image/(png|jpeg);base64,[A-Za-z0-9+/]+={0,2}$'
      required:
        - customerName
        - customerAddress
        - customerPhone
        - width
        - length
        - shape
        - poolFinish
        - waterlineTile
        - deckTile
        - edgeTreatment
        - features
        - svg
    PoolConceptRenderRequest:
      type: object
      properties:
        photoDataUrl:
          type: string
          minLength: 40
          maxLength: 2900000
          pattern: '^data:image/jpeg;base64,[A-Za-z0-9+/]+={0,2}$'
        width:
          type: integer
          minimum: 8
          maximum: 60
        length:
          type: integer
          minimum: 12
          maximum: 100
        shape:
          type: string
          enum: [rectangular, freeform, kidney, l-shape]
        poolFinish:
          type: string
          enum: [white-plaster, arctic-quartz, sandbar-quartz, sea-glass-quartz, lagoon-pebble, ocean-blue-pebble, silver-pebble, greenstone, midnight-pebble]
        waterlineTile:
          type: string
          enum: [pale-limestone, shellstone, mist-porcelain, warm-travertine, sea-glass, lagoon-glass, ocean-blue-glass, deep-navy-glass, charcoal-mosaic]
        deckTile:
          type: string
          enum: [shell-limestone, ivory-porcelain, silver-porcelain, sand-travertine, warm-limestone, coastal-shellstone, charcoal-porcelain]
        edgeTreatment:
          type: string
          enum: [flush-continuous]
        features:
          type: array
          items:
            type: string
            enum: [spa, spa-waterfall, infinity-edge, pool-lights, sun-shelf, sheer-descent, bubblers, sunken-fire-pit, outdoor-kitchen, fire-bowls, pergola, outdoor-shower]
          uniqueItems: true
      required:
        - photoDataUrl
        - width
        - length
        - shape
        - poolFinish
        - waterlineTile
        - deckTile
        - edgeTreatment
        - features
    PoolConceptRenderResponse:
      type: object
      properties:
        imageDataUrl:
          type: string
          minLength: 40
          maxLength: 6000000
          pattern: '^data:image/(png|jpeg);base64,[A-Za-z0-9+/]+={0,2}$'
      required:
        - imageDataUrl
    DesignConceptEmailResponse:
      type: object
      properties:
        status:
          type: string
          enum: [sent]
      required:
        - status

