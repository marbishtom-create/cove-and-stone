openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: appointments
    description: Appointment request operations
  - name: design-concepts
    description: Internal pool concept handoff operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /design-concepts/email:
    post:
      operationId: emailDesignConcept
      tags: [design-concepts]
      summary: Email a completed pool concept internally
      description: Sends the completed concept SVG and configuration summary to the Cove & Stone team.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesignConceptEmailRequest"
      responses:
        "202":
          description: Design concept queued for internal delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesignConceptEmailResponse"
        "400":
          description: Invalid design concept
        "502":
          description: Internal email provider failure
  /design-concepts/render:
    post:
      operationId: generatePoolConceptRender
      tags: [design-concepts]
      summary: Generate an AI pool concept and walkthrough job from a backyard photo
      description: Creates an illustrative after-image and starts a short image-to-video walkthrough job from the same concept.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PoolConceptRenderRequest"
      responses:
        "200":
          description: AI-generated pool concept image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoolConceptRenderResponse"
        "400":
          description: Invalid image or pool concept
        "429":
          description: Image generation rate limit reached
        "502":
          description: AI image generation failed
  /design-concepts/video-jobs/{videoJobId}:
    get:
      operationId: getPoolConceptVideoJob
      tags: [design-concepts]
      summary: Check a pool concept walkthrough job
      parameters:
        - name: videoJobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current walkthrough generation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoolConceptVideoJobStatus"
        "404":
          description: Walkthrough job expired or not found
  /design-concepts/videos/{videoId}:
    get:
      operationId: getPoolConceptVideo
      tags: [design-concepts]
      summary: Stream a generated pool concept walkthrough
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Generated MP4 walkthrough
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "206":
          description: Byte range of the generated MP4 walkthrough
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "404":
          description: Walkthrough expired or not found
  /appointments/request:
    post:
      operationId: requestAppointment
      tags: [appointments]
      summary: Request a design consultation appointment
      description: Sends a preferred date and time to Cove & Stone for confirmation; it does not reserve a slot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentRequestInput"
      responses:
        "202":
          description: Appointment request sent for confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentRequestResponse"
        "400":
          description: Invalid appointment request
        "429":
          description: Too many appointment requests
        "502":
          description: Internal email provider failure
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AppointmentRequestInput:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        address:
          type: string
          minLength: 5
          maxLength: 300
        phone:
          type: string
          minLength: 7
          maxLength: 30
          pattern: '^[+()0-9 .-]+$'
        preferredDate:
          type: string
          minLength: 10
          maxLength: 10
          pattern: '^\d{4}-\d{2}-\d{2}$'
        preferredTime:
          type: string
          pattern: '^(?:(?:10|11|12|13|14|15|16):(00|30)|17:00)$'
      required:
        - fullName
        - address
        - phone
        - preferredDate
        - preferredTime
    AppointmentRequestResponse:
      type: object
      properties:
        status:
          type: string
          enum: [requested]
      required:
        - status
    DesignConceptEmailRequest:
      type: object
      properties:
        customerName:
          type: string
          minLength: 2
          maxLength: 120
        customerAddress:
          type: string
          minLength: 5
          maxLength: 300
        customerPhone:
          type: string
          minLength: 7
          maxLength: 30
          pattern: '^[+()0-9 .-]+$'
        width:
          type: integer
          minimum: 8
          maximum: 60
        length:
          type: integer
          minimum: 12
          maximum: 100
        shape:
          type: string
          enum: [rectangular, freeform, kidney, l-shape]
        poolFinish:
          type: string
          enum: [white-plaster, arctic-quartz, sandbar-quartz, sea-glass-quartz, lagoon-pebble, ocean-blue-pebble, silver-pebble, greenstone, midnight-pebble]
        waterlineTile:
          type: string
          enum: [pale-limestone, shellstone, mist-porcelain, warm-travertine, sea-glass, lagoon-glass, ocean-blue-glass, deep-navy-glass, charcoal-mosaic]
        deckTile:
          type: string
          enum: [shell-limestone, ivory-porcelain, silver-porcelain, sand-travertine, warm-limestone, coastal-shellstone, charcoal-porcelain, dark-gray-porcelain, black-marble-porcelain]
        edgeTreatment:
          type: string
          enum: [flush-continuous]
        features:
          type: array
          items:
            type: string
            enum: [spa, spa-waterfall, infinity-edge, pool-lights, sun-shelf, sheer-descent, bubblers, pool-pergola-rainfall, sunken-fire-pit, outdoor-kitchen, fire-bowls, pergola, outdoor-shower]
          uniqueItems: true
        svg:
          type: string
          minLength: 1
          maxLength: 120000
        originalPhotoDataUrl:
          type: string
          maxLength: 2900000
          pattern: '^data:image/jpeg;base64,[A-Za-z0-9+/]+={0,2}$'
        aiRenderDataUrl:
          type: string
          maxLength: 6000000
          pattern: '^data:image/(png|jpeg);base64,[A-Za-z0-9+/]+={0,2}$'
        videoId:
          type: string
          format: uuid
      required:
        - customerName
        - customerAddress
        - customerPhone
        - width
        - length
        - shape
        - poolFinish
        - waterlineTile
        - deckTile
        - edgeTreatment
        - features
        - svg
    PoolConceptRenderRequest:
      type: object
      properties:
        photoDataUrl:
          type: string
          minLength: 40
          maxLength: 2900000
          pattern: '^data:image/jpeg;base64,[A-Za-z0-9+/]+={0,2}$'
        width:
          type: integer
          minimum: 8
          maximum: 60
        length:
          type: integer
          minimum: 12
          maximum: 100
        shape:
          type: string
          enum: [rectangular, freeform, kidney, l-shape]
        poolFinish:
          type: string
          enum: [white-plaster, arctic-quartz, sandbar-quartz, sea-glass-quartz, lagoon-pebble, ocean-blue-pebble, silver-pebble, greenstone, midnight-pebble]
        waterlineTile:
          type: string
          enum: [pale-limestone, shellstone, mist-porcelain, warm-travertine, sea-glass, lagoon-glass, ocean-blue-glass, deep-navy-glass, charcoal-mosaic]
        deckTile:
          type: string
          enum: [shell-limestone, ivory-porcelain, silver-porcelain, sand-travertine, warm-limestone, coastal-shellstone, charcoal-porcelain, dark-gray-porcelain, black-marble-porcelain]
        edgeTreatment:
          type: string
          enum: [flush-continuous]
        features:
          type: array
          items:
            type: string
            enum: [spa, spa-waterfall, infinity-edge, pool-lights, sun-shelf, sheer-descent, bubblers, pool-pergola-rainfall, sunken-fire-pit, outdoor-kitchen, fire-bowls, pergola, outdoor-shower]
          uniqueItems: true
        layoutElements:
          type: array
          maxItems: 12
          uniqueItems: true
          items:
            $ref: "#/components/schemas/PoolConceptLayoutElement"
      required:
        - photoDataUrl
        - width
        - length
        - shape
        - poolFinish
        - waterlineTile
        - deckTile
        - edgeTreatment
        - features
    PoolConceptLayoutElement:
      type: object
      properties:
        id:
          type: string
          enum: [pool, pergola, sun-shelf, sheer-descent, pool-lights, infinity-edge, bubblers, spa, outdoor-kitchen, sunken-fire-pit, fire-bowls, outdoor-shower]
        offsetX:
          type: number
          minimum: -18
          maximum: 18
        offsetY:
          type: number
          minimum: -14
          maximum: 14
        scaleX:
          type: number
          minimum: 0.55
          maximum: 1.8
        scaleY:
          type: number
          minimum: 0.55
          maximum: 1.8
      required: [id, offsetX, offsetY, scaleX, scaleY]
    PoolConceptRenderResponse:
      type: object
      properties:
        imageDataUrl:
          type: string
          minLength: 40
          maxLength: 6000000
          pattern: '^data:image/(png|jpeg);base64,[A-Za-z0-9+/]+={0,2}$'
        videoJobId:
          type: string
          format: uuid
      required:
        - imageDataUrl
        - videoJobId
    PoolConceptVideoJobStatus:
      type: object
      properties:
        status:
          type: string
          enum: [processing, ready, failed]
        videoId:
          type: string
          format: uuid
        videoUrl:
          type: string
        message:
          type: string
      required:
        - status
    DesignConceptEmailResponse:
      type: object
      properties:
        status:
          type: string
          enum: [sent]
      required:
        - status

